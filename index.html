<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, maximum-scale=0.4, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Press+Start+2P&family=Syne+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <button id="Clave"></button>
    <div id="Numero"></div>

    <div id="Juego">
        <div id="Puntos">
            <h1 id="Puntaje">Puntos: </h1>
        </div>
        <div id="Comida"></div>
        <div id="Comida2"></div>
        <div id="Comida3"></div>
        <div id="Comida4"></div>
        <div id="Comida5"></div>

        <div id="Bomba"></div>
        <div id="Iman"></div>
        <div id="DoblePuntos"></div>
        <div id="Corazon"></div>
        <div id="Congelacion"></div>

        <div id="Jugador"></div>
        <div id="Vidas">
            <div class="Vida" id="Vida1"></div>
            <div class="Vida" id="Vida2"></div>
            <div class="Vida" id="Vida3"></div>
        </div>

        <div id="MensajeMuerte">
            <h1 id="TextDeath">Esfuerzate mas, solo ganaste</h1>
            <h2 id="TextDeath2"> Alepuntos</h2>
            <div id="Botones">
            <button id="Reiniciar">Reiniciar</button>
            <button id="Menu">Menu</button>
            </div>
        </div>
    </div>

    <audio id="Musica" loop>
        <source src="audio/cocina.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido1">
        <source src="audio/explosion.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido2">
        <source src="audio/congelar.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido3">
        <source src="audio/iman.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido4">
        <source src="audio/multiplicador.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido5">
        <source src="audio/curar.aac" type="audio/aac">
    </audio>

    <audio id="Sonido6">
        <source src="audio/caer.aac" type="audio/aac">
    </audio>

    <audio id="Sonido7">
        <source src="audio/boton.aac" type="audio/aac">
    </audio>



    <script src="script.js"></script>
</body>
